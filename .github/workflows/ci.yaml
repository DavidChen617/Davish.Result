name: CI

on:
  pull_request:
    paths-ignore: [ 'site/**', '.github/workflows/docs.yaml' ]
  push:
    branches: [ main ]
    paths-ignore: [ 'site/**', '.github/workflows/docs.yaml' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build
